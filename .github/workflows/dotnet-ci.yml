name: .NET CI

on:
  push:
  pull_request:
    branches:
      - master

permissions: {}

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    permissions:
      contents: read
      checks: write
    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗 Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # Keep the SDK major in sync with azure-functions-deploy.yml and the net10.0 target framework.
          dotnet-version: "10.0.x"

      - name: 📦 Restore dependencies
        run: dotnet restore

      - name: 🔨 Build
        run: dotnet build --no-restore -c Release -warnaserror

      - name: 🧪 Run tests with coverage
        run: >
          dotnet test --no-build -c Release
          --logger "trx"
          --settings tests/coverlet.runsettings
          --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: 📏 Check coverage threshold (80% line)
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path TestResults -Filter coverage.cobertura.xml -Recurse | Select-Object -First 1
          if (-not $file) { Write-Error "coverage.cobertura.xml not found"; exit 1 }
          [xml]$xml = Get-Content $file.FullName
          $rate  = [double]$xml.coverage.'line-rate'
          $pct   = [math]::Round($rate * 100, 1)
          Write-Host "Line coverage: $pct%"
          if ($rate -lt 0.80) {
            Write-Error "Coverage $pct% is below the required 80% threshold"
            exit 1
          }

      - name: 📊 Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          retention-days: 7

      - name: 📈 Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report-${{ matrix.os }}
          path: TestResults/**/coverage.cobertura.xml
          retention-days: 7

  mutation-test:
    runs-on: windows-latest
    # Run mutation tests only on PRs to master (they are slow, so not on every push)
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    permissions:
      contents: read
    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗 Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # Keep the SDK major in sync with azure-functions-deploy.yml and the net10.0 target framework.
          dotnet-version: "10.0.x"

      - name: 📦 Restore dependencies
        run: dotnet restore

      - name: 🔨 Build
        run: dotnet build --no-restore -c Release -warnaserror

      - name: 🔧 Restore dotnet tools
        run: dotnet tool restore

      - name: 🧬 Run Stryker mutation tests
        run: dotnet dotnet-stryker --config-file stryker-config.json

      # Stryker exits 0 when it tests no mutants or cannot calculate a score, so thresholds.break alone is not a gate.
      - name: 👀 Verify mutants were tested
        shell: pwsh
        run: |
          $report = Get-ChildItem -Path StrykerOutput -Filter stryker-report.json -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'reports' } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $report) { Write-Output "::error::Stryker report not found"; exit 1 }
          try { $json = Get-Content -Raw $report.FullName | ConvertFrom-Json }
          catch { Write-Output "::error::Stryker report unparsable"; exit 1 }
          $tested = @('Killed', 'Survived', 'Timeout', 'NoCoverage')
          $count = 0
          foreach ($f in $json.files.PSObject.Properties) {
            $count += @($f.Value.mutants | Where-Object { $tested -contains $_.status }).Count
          }
          Write-Output "Tested mutants: $count"
          if ($count -eq 0) { Write-Output "::error::Stryker tested 0 mutants; check the mutate globs"; exit 1 }

      - name: 📊 Upload Stryker report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stryker-report
          path: StrykerOutput/**/reports/**
          retention-days: 14
